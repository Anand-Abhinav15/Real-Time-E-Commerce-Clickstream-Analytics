services:
  spark:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark

    container_name: clickstream-spark

    env_file:
      - .env

    volumes:
      - ./streaming:/app/streaming
      - ./configs:/app/configs

    command: >
      /opt/spark/bin/spark-submit
      /app/streaming/spark_streaming_job.py


  silver:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark 

    container_name: clickstream-silver 

    env_file:
      - .env 
    
    environment:
      AZURE_STORAGE_ACCOUNT: ${STORAGE_ACCOUNT}
      AZURE_STORAGE_KEY: ${AZURE_STORAGE_KEY}

    volumes:
      - ./streaming:/app/streaming 
      - ./configs:/app/configs

    command:
      - /opt/spark/bin/spark-submit
      - /app/streaming/silver_streaming_job.py

  gold:
    build:
      context: .
      dockerfile: docker/Dockerfile.spark 
    
    container_name: clickstream-gold 

    env_file:
      - .env 

    environment:
      AZURE_STORAGE_ACCOUNT: ${STORAGE_ACCOUNT}
      AZURE_STORAGE_KEY: ${AZURE_STORAGE_KEY}

    volumes:
      - ./streaming:/app/streaming 
      - ./configs:/app/configs 

    command:
      - /opt/spark/bin/spark-submit
      - /app/streaming/gold_streaming_job.py

    depends_on:
      - silver
